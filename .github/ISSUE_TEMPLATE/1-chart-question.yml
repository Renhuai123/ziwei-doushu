name: 排盘结果疑问 / Chart result question
description: 觉得某张盘排得不对？请附上出生信息和对照结果，我们才能逐项核。
title: "[排盘疑问] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        只写「不准」我们没法查。请按下面填完整，我们会逐项对照。
        先看一眼：辅星亮度、闰月归属、晚子时是否换日在各流派本来就不同，这类差异不算 bug，但仍欢迎指出。
  - type: input
    id: date
    attributes:
      label: 出生日期（公历）
      placeholder: 例：1990-05-12
    validations:
      required: true
  - type: input
    id: time
    attributes:
      label: 出生时间（几点几分）
      placeholder: 例：08:30
    validations:
      required: true
  - type: input
    id: place
    attributes:
      label: 出生地或经度
      description: 用来换算真太阳时；东西向经度差最多能差出一个时辰。
      placeholder: 例：浙江杭州 / 东经 120.2°
  - type: dropdown
    id: gender
    attributes:
      label: 性别
      options: ["男", "女"]
    validations:
      required: true
  - type: textarea
    id: ours
    attributes:
      label: 本项目排出的结果
      description: 截图，或贴出 generateChart 输出里相关的那几项。
    validations:
      required: true
  - type: input
    id: ref
    attributes:
      label: 拿什么对照
      placeholder: 例：其它排盘软件 / 某本书第几页
    validations:
      required: true
  - type: textarea
    id: theirs
    attributes:
      label: 对照结果
      description: 截图或文字。
    validations:
      required: true
  - type: textarea
    id: diff
    attributes:
      label: 具体哪一项不一致
      placeholder: 例：命宫应在卯，这里排在戌
    validations:
      required: true
