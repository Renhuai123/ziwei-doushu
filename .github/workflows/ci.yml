name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: 类型检查 + 代码检查 + 排盘回归 + 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 仓库已提交 package-lock.json：按锁定版本安装，并开 npm 缓存
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 类型检查
        run: npm run typecheck

      - name: 代码检查（ESLint）
        run: npm run lint

      - name: 排盘引擎回归
        run: npm test

      # 预览图预渲染、generateStaticParams、服务端/客户端组件边界等问题只在构建时暴露
      - name: 生产构建
        run: npm run build
