<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">人身分区</title>
  <desc id="desc">盘面左列从上往下标右肩、右胸、右胁、右足，右列对应标出左肩、左胸、左胁。朱红字点出这一帧正在写的右胸。</desc>

  <rect width="960" height="540" fill="#fff"/>

  <g fill="none" stroke-linejoin="round">
    <rect x="212" y="54" width="536" height="432" stroke="#383838" stroke-width="2.4"/>
    <path d="M346 54 V486 M614 54 V486
             M480 54 V162 M480 378 V486
             M212 162 H748 M212 378 H748
             M212 270 H346 M614 270 H748"
          stroke="#686868" stroke-width="1.6"/>
  </g>

  <g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif"
     font-size="30" fill="#292929" text-anchor="middle">
    <text x="279" y="119">右肩</text>
    <text x="681" y="119">左肩</text>
    <text x="279" y="227" fill="#a63b30" font-weight="600">右胸</text>
    <text x="681" y="227">左胸</text>
    <text x="279" y="335">右胁</text>
    <text x="681" y="335">左胁</text>
    <text x="279" y="443">右足</text>
  </g>
</svg>
