<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">颧部</title>
  <desc id="desc">人脸朝左。灰色从眼下、鼻旁隆起的颧部向后收成一柄，沿脸侧延伸，在耳朵后面露出末端，示意课中所说的颧形。</desc>

  <rect width="960" height="540" fill="#fff"/>

  <g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" fill="#292929">
    <rect x="48" y="36" width="243" height="46" rx="3" fill="none" stroke="#555" stroke-width="1.4"/>
    <text x="169.5" y="67" text-anchor="middle" font-size="24" font-weight="600">颧部呢掌的就是权</text>

    <!-- 左向侧脸。眼和鼻确定颧部的起点。 -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M513 472
               C511 449 511 426 524 405
               C542 376 575 364 600 330
               C623 299 632 263 628 222
               C622 151 576 100 509 86
               C453 74 401 85 367 117
               C339 143 329 176 329 202
               C329 214 334 219 330 231
               C326 246 313 264 301 279
               Q295 287 303 291
               Q311 295 323 294
               Q330 295 326 305
               L320 316
               Q320 321 329 324
               Q321 329 325 336
               Q328 340 334 342
               Q330 361 340 372
               C351 384 375 384 397 380
               Q416 395 416 422
               L415 472"
            fill="#fff" stroke="#393939" stroke-width="2.8"/>
      <path d="M340 208 Q356 199 378 206" stroke="#393939" stroke-width="3"/>
      <path d="M339 223 Q351 217 366 224 Q354 228 344 226" stroke="#555" stroke-width="1.8"/>
      <path d="M314 286 Q320 282 325 285 M329 324 Q338 325 346 322" stroke="#777" stroke-width="1.5"/>
    </g>

    <!-- 前端宽而隆起，向后收窄。耳廓遮住经过耳部的一段。 -->
    <path d="M354 254
             C359 244 371 240 385 241
             C405 243 419 252 440 252
             C464 252 490 246 520 237
             C533 233 544 228 554 229
             Q564 230 561 237
             C557 243 540 248 524 254
             C489 267 459 271 434 276
             C412 280 402 290 384 292
             C369 294 355 287 351 275
             Q348 264 354 254 Z"
          fill="#cececa" stroke="#777773" stroke-width="1.6" stroke-linejoin="round"/>

    <g stroke-linecap="round" stroke-linejoin="round">
      <path d="M499 240
               C497 226 504 213 519 209
               C534 204 545 215 544 231
               C543 244 535 255 527 266
               C522 275 521 285 511 287
               C503 289 498 282 499 273
               L502 257
               Q506 248 499 240 Z"
            fill="#fff" stroke="#424242" stroke-width="2.3"/>
      <path d="M508 233 C510 223 520 217 527 221
               C535 226 531 237 525 244
               Q515 254 512 266
               M507 246 Q515 243 519 249"
            fill="none" stroke="#777" stroke-width="1.6"/>
    </g>

    <g fill="none" stroke="#777" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M369 280 L276 355 H177"/>
      <path d="M556 234 L650 195 H694"/>
    </g>
    <circle cx="369" cy="280" r="2.7" fill="#656565"/>
    <circle cx="556" cy="234" r="3.8" fill="#ad4435" stroke="#fff" stroke-width="1"/>
    <text x="224" y="344" text-anchor="middle" font-size="22">颧柄很大</text>
    <text x="706" y="202" font-size="22">连到耳朵后面</text>
  </g>
</svg>
