<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">天柱纹</title>
  <desc id="desc">手掌正面朝向读者。掌心中央的一条朱红竖纹从掌根附近向上延伸至指根，右侧标出纹名和倪师所说的「走的就是科才艺」。</desc>

  <rect width="960" height="540" fill="#fff"/>

  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- 手掌外形，拇指在左，四指自掌面上缘展开。 -->
    <path d="M339 467
             C303 460 274 438 255 408
             C241 386 232 359 221 330
             L193 261
             C188 248 188 236 197 231
             C207 225 220 231 230 242
             L267 285
             C274 292 279 287 278 277
             C277 256 270 236 265 214
             L248 148
             C245 134 250 123 261 120
             C274 116 284 124 289 138
             L318 217
             C320 223 324 222 324 215
             L313 100
             C312 83 318 73 331 71
             C345 69 355 78 357 94
             L372 205
             C373 212 378 212 379 205
             L393 107
             C395 92 404 83 416 84
             C430 85 436 96 434 111
             L422 220
             C421 228 426 230 430 223
             L453 166
             C459 152 469 147 479 151
             C490 155 493 166 489 180
             L468 252
             C463 271 466 291 467 315
             C470 360 463 397 444 427
             C423 459 384 477 339 467 Z"
          fill="#fafaf8" stroke="#373735" stroke-width="2.8"/>

    <!-- 用短弧交代指节，让指根与掌心的界线清楚可见。 -->
    <g fill="none" stroke="#b2b2ac" stroke-width="1.6">
      <path d="M257 158 Q269 150 282 153 M267 190 Q280 182 295 185"/>
      <path d="M319 119 Q333 113 353 116 M324 158 Q339 152 358 155"/>
      <path d="M394 133 Q409 130 425 136 M388 167 Q402 164 420 170"/>
      <path d="M451 185 Q462 183 476 190 M442 209 Q454 207 468 214"/>
      <path d="M204 259 Q211 250 220 249"/>
    </g>

    <g fill="none" stroke="#999993" stroke-width="1.9">
      <path d="M285 251 C317 231 379 221 448 244"/>
      <path d="M277 282 C306 270 327 292 333 321 C339 349 333 374 325 393"/>
      <path d="M311 292 C343 277 393 276 434 288"/>
      <path d="M329 302 C349 314 363 332 377 355"/>
    </g>

    <!-- 竖纹止于指根。引线从竖纹旁起笔，留出空隙以区别于掌纹。 -->
    <path d="M359 417 C361 371 362 331 363 293 C364 267 365 248 366 230"
          fill="none" stroke="#b33e32" stroke-width="4.5"/>
    <path d="M372 367 L498 326 H563"
          fill="none" stroke="#797974" stroke-width="1.4"/>
  </g>

  <g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="582" y="336" font-size="34" font-weight="600" letter-spacing="2" fill="#272725">天柱纹</text>
    <text x="583" y="376" font-size="22" fill="#555551">走的就是科才艺</text>
  </g>
</svg>
