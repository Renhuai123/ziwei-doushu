<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">大小二限逢与三卦</title>
  <desc id="desc">左图把大限的十年画在同一疾厄宫格内，朱红点标出小限也到此宫的56岁，格下引出倪师对这个命例的断语。右图并列讲到长辈身体时所举的三卦。</desc>

  <defs>
    <g id="yang" fill="#303030">
      <rect width="76" height="7"/>
    </g>
    <g id="yin" fill="#303030">
      <rect width="31" height="7"/>
      <rect x="45" width="31" height="7"/>
    </g>
    <g id="earth">
      <use href="#yin"/>
      <use href="#yin" y="15"/>
      <use href="#yin" y="30"/>
    </g>
  </defs>

  <rect width="960" height="540" fill="#fff"/>
  <g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" fill="#242424">
    <path d="M505 54V482" fill="none" stroke="#dededb" stroke-width="1"/>

    <g text-anchor="middle" font-size="27" font-weight="600">
      <text x="255" y="83">大小二限逢</text>
      <text x="728" y="83">家里面的长辈</text>
    </g>

    <!-- 一个宫格内同时呈现十年大限和当年小限。 -->
    <rect x="53" y="121" width="404" height="257" fill="#fff" stroke="#414141" stroke-width="2"/>
    <path d="M54 122H456V182H54Z" fill="#f4f4f2"/>
    <path d="M53 183H457" fill="none" stroke="#aaa" stroke-width="1"/>
    <text x="77" y="161" font-size="24" font-weight="600">疾厄宫</text>
    <g font-size="21">
      <text x="326" y="160">廉贞</text>
      <text x="390" y="160">破军</text>
    </g>

    <text x="77" y="227" font-size="20">大限</text>
    <ellipse cx="181" cy="219" rx="46" ry="18" fill="none" stroke="#626262" stroke-width="1.3"/>
    <text x="181" y="226" text-anchor="middle" font-size="20">55-64</text>

    <!-- 十个刻度依次对应55至64岁，第二个刻度为56岁。 -->
    <g fill="none" stroke="#686868" stroke-width="1.6">
      <path d="M84 264H426"/>
      <path d="M84 256V272 M122 256V272 M160 258V270 M198 258V270 M236 258V270
               M274 258V270 M312 258V270 M350 258V270 M388 258V270 M426 256V272"/>
      <path d="M122 272V300" stroke="#888" stroke-width="1.2"/>
    </g>
    <circle cx="122" cy="264" r="6" fill="#b43b30" stroke="#fff" stroke-width="1.5"/>
    <text x="122" y="331" text-anchor="middle" font-size="23" font-weight="600">小限56岁</text>

    <g fill="none" stroke="#686868" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M255 379V414 M250 409L255 414L260 409"/>
    </g>
    <text x="255" y="458" text-anchor="middle" font-size="25">“死掉在56岁”</text>

    <!-- 三个卦象同级并列，均自上向下绘制六爻。 -->
    <text x="728" y="158" text-anchor="middle" font-size="22">身体要好</text>
    <g fill="none" stroke="#929292" stroke-width="1.3">
      <path d="M728 175V198 M600 211V198H856V211 M728 198V211"/>
    </g>

    <g transform="translate(562 245)">
      <use href="#earth"/>
      <use href="#yang" y="45"/>
      <use href="#yang" y="60"/>
      <use href="#yang" y="75"/>
    </g>
    <g transform="translate(690 245)">
      <use href="#earth"/>
      <use href="#earth" y="45"/>
    </g>
    <g transform="translate(818 245)">
      <use href="#earth"/>
      <use href="#yang" y="45"/>
      <use href="#yang" y="60"/>
      <use href="#yin" y="75"/>
    </g>
    <g text-anchor="middle" font-size="22">
      <text x="600" y="372">地天泰</text>
      <text x="728" y="372">坤为地</text>
      <text x="856" y="372">地风升</text>
    </g>
  </g>
</svg>
