<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">红鸾天喜与早婚</title>
  <desc id="desc">左侧命盘在顶部偏左标红鸾、下排中格标天喜，以虚线相连。右侧并列画出倪师对这次婚姻的两层解读：十四至二十三岁天喜红鸾来会，她也因缺少父亲的依靠而想早点成家。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 1.5 L8 5 L2 8.5" fill="none" stroke="#686868" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="960" height="540" fill="#fff"/>
  <g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" fill="#252525" text-anchor="middle">
    <g>
      <rect x="48" y="78" width="384" height="384" fill="#fff"/>
      <g fill="#f3f3f1">
        <rect x="144" y="78" width="96" height="96"/>
        <rect x="240" y="366" width="96" height="96"/>
      </g>
      <path d="M48 174 H432 M48 366 H432
               M144 78 V462 M336 78 V462
               M240 78 V174 M240 366 V462
               M48 270 H144 M336 270 H432"
            fill="none" stroke="#aaa" stroke-width="1.3"/>
      <rect x="48" y="78" width="384" height="384" fill="none" stroke="#4b4b4b" stroke-width="2"/>

      <path d="M201 153 L279 387" fill="none" stroke="#777" stroke-width="1.7" stroke-dasharray="5 6"/>
      <g fill="#555">
        <circle cx="201" cy="153" r="3.5"/>
        <circle cx="279" cy="387" r="3.5"/>
      </g>
      <g font-size="26" font-weight="600">
        <text x="192" y="134">红鸾</text>
        <text x="288" y="428">天喜</text>
      </g>
    </g>

    <g>
      <g font-size="23">
        <text x="571" y="154" font-weight="600">14-23</text>
        <text x="812" y="154">没有父亲的依靠</text>
      </g>
      <g fill="none" stroke="#686868" stroke-width="1.5" marker-end="url(#arrow)">
        <path d="M571 174 V205"/>
        <path d="M812 174 V205"/>
      </g>
      <g font-size="23">
        <text x="571" y="246">天喜红鸾星就来会</text>
        <text x="812" y="246">想早点成家</text>
      </g>

      <g fill="none" stroke="#686868" stroke-width="1.5" stroke-linejoin="round">
        <path d="M571 267 V290 H812 V267"/>
        <path d="M692 290 V327" marker-end="url(#arrow)"/>
      </g>
      <text x="692" y="377" font-size="27" font-weight="600">第一次的婚姻她会结的比较早</text>
      <path d="M809 392 H866" fill="none" stroke="#ad4034" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
</svg>
