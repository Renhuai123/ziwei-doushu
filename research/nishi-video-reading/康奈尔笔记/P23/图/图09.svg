<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">父母宫与天马星</title>
  <desc id="desc">上半图以父母宫中的七杀为例，画出倪师从武官星推读父亲从武职的讲法。下半图把三十三岁以后天马星动的两种去向分开，并画出倪师对本例换地方原因的解释。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M2 1.5 8 5 2 8.5" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="#fff"/>
  <g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" fill="#252525">

    <rect x="60" y="40" width="182" height="138" fill="#fff" stroke="#555" stroke-width="1.7"/>
    <rect x="61" y="41" width="180" height="44" fill="#f4f4f2"/>
    <path d="M60 85 H242" fill="none" stroke="#aaa" stroke-width="1.1"/>
    <text x="151" y="71" text-anchor="middle" font-size="23">父母宫</text>
    <ellipse cx="151" cy="130" rx="49" ry="28" fill="none" stroke="#454545" stroke-width="1.8"/>
    <text x="151" y="139" text-anchor="middle" font-size="26">七杀</text>

    <path d="M254 130 H504" fill="none" stroke="#555" stroke-width="1.7" marker-end="url(#arrow)"/>
    <text x="379" y="114" text-anchor="middle" font-size="21">武官星</text>
    <text x="528" y="139" font-size="28" font-weight="600">爸爸是从武职的</text>

    <path d="M60 216 H900" fill="none" stroke="#d4d4d1" stroke-width="1.2"/>

    <text x="70" y="302" font-size="22">33岁以后</text>
    <text x="68" y="349" font-size="31" font-weight="600" fill="#a83d32">天马星动了</text>

    <g fill="none" stroke="#555" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M244 338 H302"/>
      <path d="M302 338 V282 H378" marker-end="url(#arrow)"/>
      <path d="M302 338 V386 H378" marker-end="url(#arrow)"/>
    </g>
    <text x="398" y="291" font-size="26">到外地去发展</text>
    <text x="398" y="395" font-size="26">外调出去</text>
    <path d="M520 386 H631" fill="none" stroke="#555" stroke-width="1.7" marker-end="url(#arrow)"/>
    <text x="652" y="395" font-size="26">换到别的地方去</text>

    <g font-size="21" fill="#454545">
      <text x="272" y="481" text-anchor="middle">化忌在对面</text>
      <text x="503" y="481" text-anchor="middle">婚姻不顺</text>
      <text x="743" y="481" text-anchor="middle">不好意思</text>
    </g>
    <g fill="none" stroke="#666" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arrow)">
      <path d="M340 474 H444"/>
      <path d="M562 474 H683"/>
      <path d="M743 451 V410"/>
    </g>
  </g>
</svg>
