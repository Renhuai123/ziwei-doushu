<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">无子却有女</title>
  <desc id="desc">左图用虚线连接子女宫与对面一格，表示子女宫是空的、对面化忌，倪师据此说「无子」。右图依黑板画出阳宅东南边的房间，下方圈出倪师从阳宅得出的「有女」。</desc>

  <rect width="960" height="540" fill="#fff"/>

  <g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" fill="#282828">
    <g font-size="24" text-anchor="middle">
      <text x="134" y="117">子女宫</text>
      <text x="358" y="117">对面</text>
      <text x="705" y="117">阳宅</text>
    </g>

    <g fill="none" stroke="#373737" stroke-width="2.2">
      <rect x="78" y="147" width="112" height="112"/>
      <rect x="302" y="147" width="112" height="112"/>
    </g>
    <path d="M190 203 H302" fill="none" stroke="#898989" stroke-width="1.6" stroke-dasharray="6 6"/>
    <g font-size="26" text-anchor="middle">
      <text x="134" y="213">空的</text>
      <text x="358" y="213">化忌</text>
    </g>

    <g fill="none" stroke="#757575" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M134 276 V298 H358 V276"/>
      <path d="M246 298 V352 M239 344 L246 352 L253 344"/>
    </g>
    <text x="246" y="419" text-anchor="middle" font-size="39" font-weight="600">无子</text>

    <rect x="599" y="147" width="212" height="151" fill="#fff" stroke="#373737" stroke-width="2.2"/>
    <rect x="600.1" y="148.1" width="74.9" height="65.9" fill="#efefed"/>
    <path d="M675 147 V214 H599" fill="none" stroke="#373737" stroke-width="2.2"/>
    <path d="M709 183 H683 L655 194" fill="none" stroke="#777" stroke-width="1.4" stroke-linecap="round"/>
    <text x="717" y="190" font-size="21">东南边有房间</text>

    <path d="M705 311 V352 M698 344 L705 352 L712 344" fill="none" stroke="#757575" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="705" cy="405" rx="65" ry="39" fill="none" stroke="#ad4034" stroke-width="2.4"/>
    <text x="705" y="419" text-anchor="middle" font-size="39" font-weight="600">有女</text>
  </g>
</svg>
