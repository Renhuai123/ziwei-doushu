<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">疾厄与大小二限逢</title>
  <desc id="desc">依倪师此例，七杀在午宫，未遇吉星，讲疾厄时指向心脏。盘中箭头从日月所在格指向36-45本宫，表示对面来科禄，倪师据未来十年有大运，判断33岁大小二限逢只是小灾。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 1.5 8 5 2 8.5" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="960" height="540" fill="#fff"/>
  <g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" fill="#262626">
    <text x="46" y="59" font-size="26" font-weight="600">疾厄</text>

    <g fill="#f5f5f3">
      <rect x="171" y="88" width="250" height="92"/>
      <rect x="171" y="364" width="250" height="92"/>
    </g>
    <rect x="46" y="88" width="500" height="368" fill="none" stroke="#484848" stroke-width="1.8"/>
    <path d="M46 180H546 M46 364H546
             M171 88V456 M421 88V456
             M296 88V180 M296 364V456
             M46 272H171 M421 272H546"
          fill="none" stroke="#858585" stroke-width="1.2"/>

    <g text-anchor="middle">
      <text x="233.5" y="108" font-size="15" fill="#595959">26-35</text>
      <ellipse cx="233.5" cy="130" rx="33" ry="16" fill="none" stroke="#505050" stroke-width="1.4"/>
      <text x="233.5" y="137" font-size="21" font-weight="600">七杀</text>
      <text x="200" y="168" font-size="18">午宫</text>
      <path d="M222 162H244" fill="none" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="267" y="168" font-size="18">心脏</text>

      <text x="358.5" y="127" font-size="23" font-weight="600">36-45</text>
      <text x="358.5" y="156" font-size="16">本宫虽然没有星</text>

      <text x="233.5" y="418" font-size="19">日月同年来会</text>
      <text x="358.5" y="399" font-size="18">天府　武曲</text>
      <text x="358.5" y="434" font-size="23" font-weight="600">33岁</text>
    </g>

    <path d="M233.5 363 L357 182" fill="none" stroke="#555" stroke-width="1.7" marker-end="url(#arrow)"/>
    <rect x="233" y="256" width="125" height="32" fill="#fff"/>
    <text x="295.5" y="279" text-anchor="middle" font-size="20">对面来科禄</text>

    <g fill="none" stroke="#888" stroke-width="1.3" stroke-linejoin="round">
      <path d="M358.5 88V55H570V205H592"/>
      <path d="M358.5 456V489H570V339H592"/>
    </g>
    <g font-size="21">
      <text x="604" y="212">未来十年有大运</text>
      <text x="604" y="346">大小二限逢</text>
    </g>

    <g fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M765 205H778V339H765"/>
      <path d="M778 272H808" marker-end="url(#arrow)"/>
    </g>
    <text x="822" y="282" font-size="27" font-weight="600" fill="#a7392d">只是小灾</text>
  </g>
</svg>
