<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">陽宅</title>
  <desc id="desc">阳宅俯视示意图。两个打叉的小格表示厕所，厨的下方是父母。底排从左到右为三子、次子、长子，朱红框标出他所住的长子一格。</desc>

  <rect width="960" height="540" fill="#fff"/>
  <g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" fill="#282828">
    <text x="248" y="59" font-size="27" font-weight="600">陽宅</text>

    <g fill="none" stroke-linejoin="round">
      <rect x="248" y="83" width="408" height="408" stroke="#333" stroke-width="2.4"/>
      <g stroke="#666" stroke-width="1.6">
        <path d="M472 83 V251 H584 V83"/>
        <path d="M472 167 H656"/>
        <path d="M524 251 V311 H584 V251"/>
        <path d="M248 397 H656 M384 397 V491 M520 397 V491"/>
      </g>
      <g stroke="#666" stroke-width="2" stroke-linecap="round">
        <path d="M608 113 L632 137 M632 113 L608 137"/>
        <path d="M542 269 L566 293 M566 269 L542 293"/>
      </g>
    </g>

    <g text-anchor="middle" font-size="25">
      <text x="528" y="134">厨</text>
      <text x="528" y="218">父母</text>
      <text x="316" y="453">三子</text>
      <text x="452" y="453">次子</text>
      <text x="588" y="453">长子</text>
    </g>

    <rect x="525" y="402" width="126" height="84" fill="none" stroke="#ad4034" stroke-width="2.8"/>

    <g fill="none" stroke="#888" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">
      <path d="M636 119 L674 97 H702"/>
      <path d="M656 444 H702"/>
    </g>
    <text x="715" y="104" font-size="21">厕所</text>
    <text x="715" y="451" font-size="21">他住在这个位置上</text>
  </g>
</svg>
