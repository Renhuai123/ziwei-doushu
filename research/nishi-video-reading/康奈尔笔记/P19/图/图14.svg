<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">天喜红鸾星来会</title>
  <desc id="desc">左侧命盘圈出板书的「34」，右侧按两段大运对读：34岁小运会到，尚未进入天喜、红鸾来会的36至45岁大运。倪师在此例推到40岁红鸾星才动，另谈进入这段大运而仍住西北角的情形。</desc>

  <rect width="960" height="540" fill="#fff"/>

  <g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" fill="#252525">
    <text x="52" y="56" font-size="27" font-weight="600">我们先看命</text>

    <!-- 命盘只落可辨的板书。底排的圈单独保留，以便和右侧的34岁对读。 -->
    <g fill="none" stroke="#939393" stroke-width="1.3" stroke-linejoin="round">
      <rect x="52" y="83" width="352" height="320" fill="#fff" stroke="#505050" stroke-width="1.8"/>
      <rect x="140" y="163" width="176" height="160" fill="#f7f7f6" stroke="none"/>
      <path d="M52 163H404 M52 323H404 M140 83V403 M316 83V403"/>
      <path d="M228 83V163 M228 323V403 M52 243H140 M316 243H404"/>
    </g>

    <g text-anchor="middle">
      <g font-size="20">
        <text x="96" y="116">天梁</text>
        <text x="184" y="116">七杀</text>
      </g>
      <text x="96" y="147" font-size="16" fill="#626262">16-25</text>
      <text x="228" y="248" font-size="25">51. 男</text>
      <ellipse cx="184" cy="352" rx="27" ry="21" fill="none" stroke="#353535" stroke-width="1.8"/>
      <text x="184" y="360" font-size="24" font-weight="600">34</text>
    </g>

    <!-- 两个十年使用相同的层次。小运的判断放在所属十年之内。 -->
    <g>
      <text x="461" y="75" font-size="33" font-weight="600">26-35</text>
      <text x="587" y="72" font-size="23">对面是化忌冲</text>
      <path d="M738 64H768 M762 59L769 64L762 69" fill="none" stroke="#666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="784" y="72" font-size="23">诸事不顺</text>

      <path d="M476 96V160H501" fill="none" stroke="#a0a0a0" stroke-width="1.4"/>
      <text x="518" y="130" font-size="24" font-weight="600">34岁</text>
      <text x="602" y="130" font-size="23">小运会到</text>
      <text x="518" y="171" font-size="22">但大运十年没有会到</text>
    </g>

    <path d="M460 212H908" fill="none" stroke="#d4d4d4" stroke-width="1.2"/>

    <g>
      <text x="461" y="270" font-size="33" font-weight="600">36-45</text>
      <text x="587" y="267" font-size="23">天喜红鸾星才会来会</text>

      <path d="M476 291V344H501" fill="none" stroke="#a0a0a0" stroke-width="1.4"/>
      <circle cx="501" cy="344" r="4.8" fill="#ad4034"/>
      <text x="518" y="353" font-size="28" font-weight="600">40岁</text>
      <text x="602" y="352" font-size="24">红鸾星才会动</text>
    </g>

    <!-- 另起一行，保留倪师谈西北角时的条件语气。 -->
    <path d="M52 441H908" fill="none" stroke="#b5b5b5" stroke-width="1.2"/>
    <g font-size="21">
      <text x="52" y="490">如果进入36-45的时候</text>
      <text x="345" y="490">他的运还是在西北角</text>
      <path d="M567 482H643 M636 477L644 482L636 487" fill="none" stroke="#666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="667" y="490">还是没有动</text>
    </g>
  </g>
</svg>
