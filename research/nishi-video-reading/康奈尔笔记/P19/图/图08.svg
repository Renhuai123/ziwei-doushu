<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">佛罗里达三户</title>
  <desc id="desc">按倪师的讲述，三个圆圈从左到右代表 A、B、C 三户，龙卷风过后，两侧房屋被打得稀烂，中间的 B 户连瓦都没少一个。倪师说弟弟查看后认为受损的两户是分金煞，又转述警察说这两家贩毒，借此劝人不要贩毒。</desc>

  <defs>
    <g id="ruin" stroke="#343434" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <!-- 一段屋面塌到地上，另一段只剩断椽。 -->
      <path d="M-48 16 L-17 -12 L-10 -5 L-36 21 Z" fill="#e5e5e2"/>
      <path d="M-33 4 L-26 10 M-24 -4 L-18 2" fill="none" stroke="#858585" stroke-width="1.5"/>
      <path d="M-5 -17 L5 -28 L15 -19 L10 -13 L6 -16 L1 -11 Z" fill="#e5e5e2"/>
      <path d="M13 -5 L26 5 L35 0 L43 9" fill="none"/>
      <path d="M-34 24 L-32 13 M-19 24 L-17 12 L-9 15 L-5 9 L3 18
               M12 24 L16 4 L22 11 L28 8 L30 24" fill="none"/>
      <path d="M-46 25 H-26 M-22 25 L-10 19 L-2 25 H8 M12 25 H42" fill="none"/>
    </g>
    <g id="house" stroke="#343434" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-33 -3 V25 H33 V-3" fill="#fff"/>
      <path d="M-44 -3 L0 -34 L44 -3 Z" fill="#e5e5e2"/>
      <path d="M-25 -16 H25 M-16 -16 L-24 -4 M0 -16 V-4 M16 -16 L24 -4
               M-4 -30 L-10 -17 M4 -30 L10 -17" fill="none" stroke="#858585" stroke-width="1.4"/>
      <path d="M-8 25 V6 H8 V25 M-39 25 H39" fill="none"/>
    </g>
  </defs>

  <rect width="960" height="540" fill="#fff"/>
  <g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" fill="#272727">
    <text x="62" y="65" font-size="26" font-weight="600">佛罗里达</text>

    <g transform="translate(687 48)" fill="none" stroke="#626262" stroke-width="2.2" stroke-linecap="round">
      <path d="M-26 -9 C-16 -17 22 -16 26 -9 C29 -3 0 2 -18 -2
               M-18 3 C-10 8 8 7 17 2 M12 10 C4 14 -4 14 -9 12
               M-5 18 Q2 20 7 16 M2 23 Q0 27 -5 29"/>
    </g>
    <text x="735" y="64" font-size="26" font-weight="600">龙卷风来了</text>
    <path d="M62 91 H898" fill="none" stroke="#c4c4c0" stroke-width="1.3"/>

    <g text-anchor="middle" font-size="29" font-weight="600">
      <text x="204" y="153">A</text>
      <text x="480" y="153">B</text>
      <text x="756" y="153">C</text>
    </g>
    <g fill="#fafaf9" stroke="#777772" stroke-width="1.6">
      <circle cx="204" cy="239" r="65"/>
      <circle cx="480" cy="239" r="65"/>
      <circle cx="756" cy="239" r="65"/>
    </g>
    <use href="#ruin" transform="translate(204 241)"/>
    <use href="#house" transform="translate(480 241)"/>
    <use href="#ruin" transform="translate(756 241) scale(-1 1)"/>

    <g text-anchor="middle" font-size="27" font-weight="600">
      <text x="204" y="352">打得稀烂</text>
      <text x="480" y="352">平安无事</text>
      <text x="756" y="352">打得稀烂</text>
    </g>
    <g text-anchor="middle" font-size="19" fill="#565652">
      <text x="204" y="391">分金煞</text>
      <text x="204" y="421">贩毒的</text>
      <text x="480" y="391">瓦都没有少一个</text>
      <text x="756" y="391">分金煞</text>
      <text x="756" y="421">贩毒的</text>
    </g>

    <path d="M62 484 H346 M614 484 H898" fill="none" stroke="#c4c4c0" stroke-width="1.3"/>
    <text x="480" y="492" text-anchor="middle" font-size="22">“所以不要去贩毒哈”</text>
  </g>
</svg>
