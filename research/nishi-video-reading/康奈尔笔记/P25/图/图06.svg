<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">大限和小流年</title>
  <desc id="desc">上半图画同一个八字换成男命时，十年大运的排法反过来，年龄仍由43–52、53–62数到63–72，再接着循环。下半图依此处口述画小流年，男孩子顺转，女孩子逆转。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 12" refX="8" refY="6" markerWidth="7" markerHeight="8" orient="auto">
      <path d="M2 2 L8 6 L2 10" fill="none" stroke="#444" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="#fff"/>
  <g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" fill="#242424">
    <text x="66" y="83" font-size="31" font-weight="600">十年大运</text>
    <text x="226" y="82" font-size="25">刚好反过来而已</text>

    <g fill="#f7f7f5" stroke="#555" stroke-width="1.5">
      <rect x="68" y="130" width="188" height="76" rx="3"/>
      <rect x="324" y="130" width="188" height="76" rx="3"/>
      <rect x="580" y="130" width="188" height="76" rx="3"/>
    </g>
    <g font-size="32" font-weight="500" text-anchor="middle">
      <text x="162" y="180">43-52</text>
      <text x="418" y="180">53-62</text>
      <text x="674" y="180">63-72</text>
    </g>
    <g fill="none" stroke="#444" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)">
      <path d="M267 168 H311"/>
      <path d="M523 168 H567"/>
      <path d="M780 168 H816 A36 36 0 0 1 816 240 H775"/>
    </g>
    <text x="756" y="248" font-size="22" text-anchor="end">又循环回来</text>

    <path d="M66 291 H894" stroke="#c9c9c5" stroke-width="1.3"/>

    <text x="66" y="348" font-size="29" font-weight="600">小流年还是一样哦</text>
    <g fill="none" stroke="#444" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow)">
      <path d="M136 465 A37 37 0 1 1 168 408"/>
      <path d="M575 465 A37 37 0 1 0 543 408"/>
    </g>
    <g font-size="27">
      <text x="204" y="439">男孩子顺转</text>
      <text x="645" y="439">女孩子逆转</text>
    </g>
  </g>
</svg>
