<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">交友宫</title>
  <desc id="desc">交友宫的同一格里，由左至右竖排破军、左辅、地劫、天马。天马的「天」字下方有一道朱红短线，标出讲课时手指所指之处。</desc>
  <rect width="960" height="540" fill="#fff"/>
  <g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" fill="#242424">
    <rect x="144" y="118" width="672" height="316" fill="none" stroke="#444" stroke-width="2"/>
    <rect x="176" y="94" width="138" height="48" fill="#fff"/>
    <text x="245" y="128" text-anchor="middle" font-size="30" font-weight="600" letter-spacing="2">交友宫</text>
    <g text-anchor="middle" font-size="48" font-weight="500">
      <text aria-label="破军"><tspan x="246" y="249">破</tspan><tspan x="246" y="325">军</tspan></text>
      <text aria-label="左辅"><tspan x="402" y="249">左</tspan><tspan x="402" y="325">辅</tspan></text>
      <text aria-label="地劫"><tspan x="558" y="249">地</tspan><tspan x="558" y="325">劫</tspan></text>
      <text aria-label="天马"><tspan x="714" y="249">天</tspan><tspan x="714" y="325">马</tspan></text>
    </g>
    <path d="M700 259 H728" fill="none" stroke="#ae4034" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
