<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">日丽中天与巨日会命</title>
  <desc id="desc">左图画紫微在酉时的太阳午宫。命宫就在午宫，是一辈子的正格；大限走到午宫，则只论那十年，十三至二十二岁是讲课中举的求学之例。右图另画一盘，太阳与巨门都庙旺，两条线从各自的宫格会向左下同一个命宫。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 1.5 L8 5 L2 8.5" fill="none" stroke="#454545" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="960" height="540" fill="#fff"/>
  <g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" fill="#242424">
    <g fill="none" stroke="#484848" stroke-width="1.4">
      <rect x="40" y="36" width="169" height="47" rx="2"/>
      <rect x="513" y="36" width="151" height="47" rx="2"/>
    </g>
    <g font-size="25" font-weight="600" text-anchor="middle" letter-spacing="1.5">
      <text x="124.5" y="68">日丽中天格</text>
      <text x="588.5" y="68">巨日会命</text>
    </g>
    <path d="M478 37 V494" fill="none" stroke="#dedede"/>

    <!-- 从同一个午格分出本命与十年两种读法。 -->
    <rect x="157" y="112" width="115" height="88" fill="#f5f5f3" stroke="#393939" stroke-width="2"/>
    <g text-anchor="middle">
      <text x="214.5" y="149" font-size="26" font-weight="600">太阳</text>
      <text x="214.5" y="181" font-size="22">午</text>
    </g>
    <path d="M273 156 H296" fill="none" stroke="#929292" stroke-width="1.2"/>
    <text x="306" y="162" font-size="19">中午11-1点</text>

    <g fill="none" stroke="#646464" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M214.5 201 V229 M111 249 V229 H326 V249"/>
    </g>
    <g text-anchor="middle" font-size="22" font-weight="600">
      <text x="111" y="282">命宫在这里</text>
      <text x="326" y="282">十年</text>
    </g>
    <g fill="none" stroke="#969696" stroke-width="1.3">
      <path d="M111 296 V318"/>
      <path d="M326 296 V311 M268 327 V311 H384 V327"/>
    </g>
    <g text-anchor="middle">
      <text x="111" y="355" font-size="25" font-weight="600">正格</text>
      <text x="111" y="390" font-size="21">一辈子</text>
      <text x="268" y="355" font-size="21">23-32</text>
      <text x="384" y="355" font-size="21">13-22岁</text>
      <path d="M384 369 V394" fill="none" stroke="#969696" stroke-width="1.3"/>
      <text x="384" y="424" font-size="18">考试都很棒</text>
    </g>

    <!-- 只在讲到的三个宫格落字。两线从不同宫格进入同一命宫。 -->
    <g>
      <path d="M614 112 H715 V203 H614 Z M816 294 H917 V385 H816 Z" fill="#f3f3f1"/>
      <g fill="none" stroke-linejoin="round">
        <rect x="513" y="112" width="404" height="364" stroke="#555" stroke-width="1.6"/>
        <path d="M614 112 V476 M816 112 V476 M715 112 V203 M715 385 V476
                 M513 203 H917 M513 385 H917 M513 294 H614 M816 294 H917"
              stroke="#b0b0ad" stroke-width="1.2"/>
      </g>
      <g text-anchor="middle">
        <text x="664.5" y="146" font-size="25" font-weight="600">太阳</text>
        <text x="664.5" y="177" font-size="19">午</text>
        <text x="866.5" y="333" font-size="25" font-weight="600">巨门</text>
        <text x="866.5" y="363" font-size="18">庙旺</text>
      </g>
      <g fill="none" stroke="#454545" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)">
        <path d="M660 198 L580 406"/>
        <path d="M820 339 L587 410"/>
      </g>
      <rect x="624" y="243" width="48" height="27" rx="2" fill="#fff"/>
      <text x="648" y="263" text-anchor="middle" font-size="18">庙旺</text>
      <circle cx="577" cy="413" r="5" fill="#ad4033"/>
      <text x="563.5" y="452" text-anchor="middle" font-size="25" font-weight="600">命宫</text>
    </g>
  </g>
</svg>
