<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">兄弟宫与眉相</title>
  <desc id="desc">本例兄弟宫有武曲、天相，倪师提醒先看眉毛再作判断。下方并列两幅正面眉眼图，左图以细长眉示意「兄弟大贵」，右图在同样的细长眉上画出上旋的眉尾，示意「兄弟众多」。</desc>
  <defs>
    <g id="eye">
      <path d="M-48 3 Q-24-12-4-11 Q20-11 38 4 Q19 13-2 13 Q-24 13-48 3Z" fill="#fff"/>
      <path d="M-12-10 Q-16 0-9 6 Q-2 13 5 6 Q11 0 7-10" fill="#ebebeb" stroke="#aaa" stroke-width="1.3"/>
      <circle cx="-2" cy="-2" r="3.6" fill="#999"/>
      <path d="M-48 3 Q-24-12-4-11 Q20-11 38 4" fill="none" stroke="#888" stroke-width="2" stroke-linecap="round"/>
      <path d="M-48 3 Q-24 13-2 13 Q19 13 38 4" fill="none" stroke="#aaa" stroke-width="1.4" stroke-linecap="round"/>
    </g>
    <g id="eyes">
      <use href="#eye" transform="translate(-66 0)"/>
      <use href="#eye" transform="translate(66 0) scale(-1 1)"/>
      <path d="M-17 4 Q-14 11-16 25 M17 4 Q14 11 16 25" fill="none" stroke="#ccc" stroke-width="1.4" stroke-linecap="round"/>
    </g>
    <path id="long-brow" d="M-20-32 C-42-39-67-44-91-45 C-108-46-125-44-143-42 C-126-47-109-50-91-50 C-65-50-40-45-21-39 Q-17-38-17-35 Q-17-32-20-32Z"/>
    <path id="turned-brow" d="M-20-32 C-42-39-67-44-91-45 C-114-46-137-49-144-72 C-142-53-132-44-114-42 C-106-41-98-40-91-40 C-67-39-42-34-21-29 Q-17-28-17-31 Q-17-33-20-32Z"/>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M2 1.5 8 5 2 8.5" fill="none" stroke="#666" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="960" height="540" fill="#fff"/>
  <g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" fill="#242424" text-anchor="middle">
    <g transform="translate(54 32)">
      <rect width="186" height="110" fill="#fff" stroke="#454545" stroke-width="1.6"/>
      <path d="M0 70 H186" stroke="#c6c6c6" stroke-width="1.2"/>
      <text x="54" y="45" font-size="25" font-weight="600">武曲</text>
      <text x="132" y="45" font-size="25" font-weight="600">天相</text>
      <text x="93" y="97" font-size="19">兄弟宫</text>
    </g>

    <text x="393" y="78" font-size="22">先不要确定他</text>
    <path d="M261 97 H525" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="560" y="99" text-anchor="start" font-size="32" font-weight="600">看看他的眉毛</text>

    <path d="M54 166 H906 M480 201 V492" fill="none" stroke="#dededb" stroke-width="1.2"/>

    <text x="260" y="219" font-size="24">越细越长</text>
    <text x="700" y="219" font-size="24">那个尾巴旋起来</text>

    <g transform="translate(260 350)">
      <use href="#eyes"/>
      <use href="#long-brow"/>
      <use href="#long-brow" transform="scale(-1 1)"/>
    </g>
    <text x="382" y="267" font-size="17" fill="#555">罗睺</text>
    <path d="M381 275 V282 L354 296" fill="none" stroke="#999" stroke-width="1.2" stroke-linecap="round"/>

    <g transform="translate(700 350)">
      <use href="#eyes"/>
      <use href="#turned-brow"/>
      <use href="#turned-brow" transform="scale(-1 1)"/>
      <path d="M130-48 Q141-55 144-72 Q143-55 135-47Z" fill="#ad392f"/>
    </g>

    <g fill="none" stroke="#777" stroke-width="1.4" marker-end="url(#arrow)">
      <path d="M260 389 V419"/>
      <path d="M700 389 V419"/>
    </g>
    <g font-size="29" font-weight="600">
      <text x="260" y="469">兄弟大贵</text>
      <text x="700" y="469">兄弟众多</text>
    </g>
  </g>
</svg>
