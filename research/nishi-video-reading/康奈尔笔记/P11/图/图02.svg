<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">紫微星碰到辅弼星</title>
  <desc id="desc">命盘下排的一格放大呈现。紫微、破军圈在一起，圈下标命宫，左辅、右弼竖列于圈右，同在格内。格外的箭头引出倪师对紫微遇辅弼的判断。</desc>

  <rect width="960" height="540" fill="#fff"/>

  <!-- 邻格只留局部框线，示意所看的是命盘下排的一格。 -->
  <g fill="none" stroke="#c9c9c6" stroke-width="1.5">
    <path d="M54 161 H568 M54 421 H568"/>
    <path d="M99 125 V161 M527 125 V161"/>
  </g>
  <rect x="99" y="161" width="428" height="260" fill="#fff" stroke="#393939" stroke-width="2.4"/>

  <g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" fill="#242424" text-anchor="middle">
    <text x="313" y="111" font-size="25" font-weight="600">光管这个宫</text>

    <!-- 大圈仅圈紫微、破军。左辅、右弼与它们共用同一宫格。 -->
    <ellipse cx="231" cy="268" rx="91" ry="65" fill="none" stroke="#494949" stroke-width="2"/>
    <g font-size="31" font-weight="500">
      <text x="203" y="259">紫<tspan x="203" dy="39">微</tspan></text>
      <text x="259" y="259">破<tspan x="259" dy="39">军</tspan></text>
      <text x="386" y="259">左<tspan x="386" dy="39">辅</tspan></text>
      <text x="449" y="259">右<tspan x="449" dy="39">弼</tspan></text>
    </g>

    <ellipse cx="231" cy="366" rx="37" ry="21" fill="none" stroke="#777" stroke-width="1.4"/>
    <text x="231" y="373" font-size="20">命宫</text>

    <path d="M527 285 H606 M598 278 L606 285 L598 292" fill="none" stroke="#555" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="764" y="267" font-size="24">紫微星碰到辅弼星</text>
    <text x="764" y="314" font-size="32" font-weight="600">非常好非常的贵</text>
  </g>
</svg>
