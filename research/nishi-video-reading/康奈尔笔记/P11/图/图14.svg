<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">武官星与好的流年</title>
  <desc id="desc">左侧画武曲贪狼来会的两层判断：逢到疾厄宫，因都入庙而不是杀；要用武官星，还要逢到官星和好的流年。右侧以板书下排左起第二格为命宫，沿箭头从3岁走到33至42岁，点出中运进来的位置。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1 L6.5 4 L1 7" fill="none" stroke="#646464" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="#fff"/>
  <g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" fill="#252525">
    <text x="44" y="87" font-size="31" font-weight="600">武曲贪狼来会</text>
    <g fill="none" stroke="#777" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M58 107 V203 H83 M58 139 H83"/>
      <path d="M98 220 V259 H119"/>
      <path d="M201 259 H228" marker-end="url(#arrow)"/>
    </g>
    <text x="95" y="147" font-size="24">武官带</text>
    <text x="95" y="211" font-size="24">逢到疾厄宫</text>
    <g font-size="21">
      <text x="130" y="267">都入庙</text>
      <text x="242" y="267">不是杀</text>
    </g>

    <path d="M44 309 H363" fill="none" stroke="#d4d4d4" stroke-width="1.2"/>
    <text x="44" y="401" font-size="27" font-weight="600">武官星</text>
    <g fill="none" stroke="#777" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M143 392 H164 M183 361 H164 V423 H183"/>
    </g>
    <g font-size="23">
      <text x="197" y="369">逢到官星</text>
      <text x="197" y="431">好的流年</text>
    </g>

    <g fill="none" stroke-linejoin="round">
      <path d="M805 270 H924 V374 H805 Z" fill="#f3f3f1"/>
      <rect x="448" y="62" width="476" height="416" stroke="#505050" stroke-width="2"/>
      <path d="M448 166 H924 M448 374 H924
               M567 62 V478 M805 62 V478
               M686 62 V166 M686 374 V478
               M448 270 H567 M805 270 H924" stroke="#969696" stroke-width="1.35"/>
    </g>
    <g text-anchor="middle">
      <text x="686" y="283" font-size="31" fill="#777">女</text>
      <text x="626.5" y="403" font-size="18">命宫</text>
      <g font-size="22" font-weight="500">
        <text x="626.5" y="435">3-12岁</text>
        <text x="745.5" y="435">13~22</text>
        <text x="864.5" y="435">23-32岁</text>
      </g>
      <text x="864.5" y="312" font-size="25" font-weight="600">33-42</text>
      <text x="864.5" y="343" font-size="19">中运进来</text>
    </g>
    <g fill="none" stroke="#646464" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M626.5 454 H728" marker-end="url(#arrow)"/>
      <path d="M746 454 H848" marker-end="url(#arrow)"/>
      <path d="M865 454 H904 V359 H872" marker-end="url(#arrow)"/>
    </g>
    <circle cx="864.5" cy="359" r="4.5" fill="#ae3c30"/>
  </g>
</svg>
