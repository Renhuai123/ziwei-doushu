<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">太阳陷亥用象批</title>
  <desc id="desc">命盘左下格为紫微天府，上一格为卯宫太阴，右下格为亥宫太阳，亥上一格为戌宫。紫府一格若作财帛宫，讲库星与权力；太阳所在的亥格若作田宅宫，从晚上出太阳取火灾之象，若换作父母宫，则以太阳指爸爸。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 1.5 L8 5 L2 8.5" fill="none" stroke="#656565" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="960" height="540" fill="#fff"/>
  <g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" fill="#282828">
    <g stroke-linejoin="round">
      <rect x="40" y="48" width="480" height="368" fill="#fff" stroke="#454545" stroke-width="2"/>
      <path d="M160 48 V416 M400 48 V416 M280 48 V140 M280 324 V416
               M40 140 H520 M40 324 H520 M40 232 H160 M400 232 H520"
            fill="none" stroke="#777" stroke-width="1.4"/>
    </g>

    <g text-anchor="middle">
      <text x="100" y="258" font-size="17" fill="#555">卯宫</text>
      <text x="100" y="288" font-size="25" font-weight="600">太阴</text>
      <text x="100" y="312" font-size="16" fill="#555">5-7点</text>

      <text x="100" y="379" font-size="23" font-weight="600">紫微天府</text>

      <text x="460" y="285" font-size="19" fill="#555">戌宫</text>
      <text x="460" y="350" font-size="17" fill="#555">亥宫</text>
      <text x="460" y="381" font-size="27" font-weight="600" fill="#aa392d">太阳</text>
      <text x="460" y="405" font-size="16" fill="#555">晚9-11点</text>
    </g>

    <g fill="none" stroke="#656565" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M491 372 H550 V185 H579" marker-end="url(#arrow)"/>
      <path d="M550 372 H579" marker-end="url(#arrow)"/>
    </g>

    <text x="597" y="105" font-size="30" font-weight="600" letter-spacing="2">用象批</text>
    <g font-size="25" font-weight="600">
      <text x="597" y="193">田宅宫</text>
      <text x="597" y="380">父母宫</text>
    </g>
    <g font-size="21">
      <text x="597" y="239">晚上出太阳</text>
      <text x="803" y="239">火灾</text>
      <text x="597" y="426">太阳</text>
      <text x="803" y="426">爸爸</text>
    </g>
    <g fill="none" stroke="#656565" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arrow)">
      <path d="M715 232 H784"/>
      <path d="M655 419 H784"/>
    </g>

    <path d="M100 416 V451" fill="none" stroke="#888" stroke-width="1.3"/>
    <g font-size="18">
      <text x="40" y="482">如果这个是财帛宫</text>
      <text x="239" y="482">库星</text>
      <text x="331" y="482">很大的权利</text>
    </g>
    <g fill="none" stroke="#656565" stroke-width="1.3" stroke-linecap="round" marker-end="url(#arrow)">
      <path d="M197 476 H225"/>
      <path d="M287 476 H317"/>
    </g>
  </g>
</svg>
