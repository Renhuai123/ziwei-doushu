<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">巨门化忌再逢天马</title>
  <desc id="desc">命盘左上格内，天马星写在巨门化忌下方，向右连到倪师的比喻「骑着马打官司」和他所说的「车祸」。下方从「春夏秋冬」中点出「冬」，与上方的「车祸」合成他举的例子「冬天发生车祸」。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M2 1.5 L8 5 L2 8.5" fill="none" stroke="#656565" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="960" height="540" fill="#fff"/>
  <g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" fill="#262626">
    <rect x="58" y="40" width="154" height="47" rx="3" fill="none" stroke="#555" stroke-width="1.4"/>
    <text x="135" y="72" text-anchor="middle" font-size="24" font-weight="600">以此类推</text>

    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M274 139 H316 M274 269 H316 M58 269 V307 M274 269 V307" stroke="#bcbcbc" stroke-width="1.4"/>
      <rect x="58" y="139" width="216" height="130" fill="#f6f6f4" stroke="#444" stroke-width="2"/>
    </g>
    <text x="87" y="193" font-size="30" font-weight="600">巨门化忌</text>
    <text x="87" y="239" font-size="27">天马星</text>

    <g fill="none" stroke="#656565" stroke-width="1.7" stroke-linecap="round" marker-end="url(#arrow)">
      <path d="M290 205 H383"/>
      <path d="M591 205 H721"/>
    </g>
    <text x="487" y="215" text-anchor="middle" font-size="29">骑着马打官司</text>
    <text x="785" y="217" text-anchor="middle" font-size="35" font-weight="600">车祸</text>

    <text x="87" y="421" font-size="32"><tspan>春</tspan><tspan x="151">夏</tspan><tspan x="215">秋</tspan><tspan x="279">冬</tspan></text>
    <path d="M279 433 H311" fill="none" stroke="#ad3c30" stroke-width="3.5" stroke-linecap="round"/>

    <g fill="none" stroke="#656565" stroke-width="1.7" stroke-linecap="round" marker-end="url(#arrow)">
      <path d="M330 409 H657"/>
      <path d="M785 241 V363"/>
    </g>
    <text x="785" y="421" text-anchor="middle" font-size="31" font-weight="600">冬天发生车祸</text>
  </g>
</svg>
