<svg xmlns="http://www.w3.org/2000/svg" width="920" height="920" viewBox="0 0 920 920" role="img" aria-labelledby="t d">
<title id="t">P37-斗数扩大 命盘（照视频逐格重画）</title>
<desc id="d">按倪海厦《天纪》紫微斗数视频里后期贴出的电子命盘逐格重画，是我们自己画的图，不是视频截图；灰底格是视频里没出现的格。</desc>
<rect width="920" height="920" fill="#fff"/>
<g font-family="'PingFang SC','Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei',sans-serif">
<text x="11.0" y="216.0" font-size="22" font-weight="600" fill="#242424">子女</text><text x="219.0" y="216.0" font-size="22" fill="#242424" text-anchor="end">巳</text>
<text x="241.0" y="216.0" font-size="22" font-weight="600" fill="#242424">夫妻</text><text x="449.0" y="216.0" font-size="22" fill="#242424" text-anchor="end">午</text>
<text x="471.0" y="216.0" font-size="22" font-weight="600" fill="#242424">兄弟</text><text x="679.0" y="216.0" font-size="22" fill="#242424" text-anchor="end">未</text>
<text x="701.0" y="216.0" font-size="22" font-weight="600" fill="#242424">命宫</text><text x="909.0" y="216.0" font-size="22" fill="#242424" text-anchor="end">申</text>
<text x="11.0" y="446.0" font-size="22" font-weight="600" fill="#242424">孙</text><text x="219.0" y="446.0" font-size="22" fill="#242424" text-anchor="end">辰</text>
<text x="701.0" y="446.0" font-size="22" font-weight="600" fill="#242424">父母</text><text x="909.0" y="446.0" font-size="22" fill="#242424" text-anchor="end">酉</text>
<text x="11.0" y="676.0" font-size="22" font-weight="600" fill="#242424">曾孙</text><text x="219.0" y="676.0" font-size="22" fill="#242424" text-anchor="end">卯</text>
<text x="701.0" y="676.0" font-size="22" font-weight="600" fill="#242424">祖父母</text><text x="909.0" y="676.0" font-size="22" fill="#242424" text-anchor="end">戌</text>
<text x="11.0" y="906.0" font-size="22" font-weight="600" fill="#242424">曾曾孙</text><text x="219.0" y="906.0" font-size="22" fill="#242424" text-anchor="end">寅</text>
<text x="241.0" y="906.0" font-size="22" font-weight="600" fill="#242424"></text><text x="449.0" y="906.0" font-size="22" fill="#242424" text-anchor="end">丑</text>
<text x="471.0" y="906.0" font-size="22" font-weight="600" fill="#242424"></text><text x="679.0" y="906.0" font-size="22" fill="#242424" text-anchor="end">子</text>
<text x="701.0" y="906.0" font-size="22" font-weight="600" fill="#242424">曾祖父母</text><text x="909.0" y="906.0" font-size="22" fill="#242424" text-anchor="end">亥</text>
<rect x="1" y="1" width="918" height="918" fill="none" stroke="#444" stroke-width="2"/>
<path d="M230.0 0 V920M0 230.0 H920" stroke="#444" stroke-width="1.2"/>
<path d="M690.0 0 V920M0 690.0 H920" stroke="#444" stroke-width="1.2"/>
<path d="M460.0 0 V230.0M460.0 690.0 V920M0 460.0 H230.0M690.0 460.0 H920" stroke="#444" stroke-width="1.2"/>
<text x="460.0" y="340.0" font-size="34" font-weight="600" fill="#242424" text-anchor="middle" letter-spacing="2">P37-斗数扩大</text>
<text x="460.0" y="380.0" font-size="23" fill="#4a4a4a" text-anchor="middle">命宫申</text>
<text x="460.0" y="424.0" font-size="18" fill="#8a8a8a" text-anchor="middle">照视频里贴出的示意图逐格重画</text>
<text x="460.0" y="451.0" font-size="18" fill="#8a8a8a" text-anchor="middle">我们自己画的图，不是视频截图</text>
<text x="460.0" y="478.0" font-size="18" fill="#8a8a8a" text-anchor="middle">视频 00:29:43–00:38:58（2 段）</text>
<text x="460.0" y="505.0" font-size="18" fill="#8a8a8a" text-anchor="middle">这是宫位向祖孙几代延伸的示意，</text>
<text x="460.0" y="532.0" font-size="18" fill="#8a8a8a" text-anchor="middle">不是命例，视频里格中本来没有星曜</text>
</g></svg>
