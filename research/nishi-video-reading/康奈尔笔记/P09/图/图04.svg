<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">官禄宫喜权星</title>
  <desc id="desc">上方分列算命的两部分，运的部分尚未介绍。下方把化权、紫微七杀同宫分别连到官禄宫内的权星，再画出财星与权星会在一起称为财权，并列举倪师口述的两个职位。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 1.5 L8 5 L2 8.5" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="#fff"/>
  <g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" fill="#242424">
    <g fill="none" stroke="#888" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M165 73 H194 M194 50 V96 M194 50 H216 M194 96 H216"/>
      <path d="M659 73 H692"/>
    </g>
    <text x="49" y="80" font-size="22" font-weight="600">算命的部分</text>
    <g font-size="21">
      <text x="231" y="57">指点迷津</text>
      <text x="231" y="103">批流年</text>
      <text x="554" y="80" font-weight="600">运的部分</text>
      <text x="708" y="80" fill="#666">还没开始介绍</text>
    </g>
    <path d="M48 135 H912" fill="none" stroke="#d3d3d3" stroke-width="1.2"/>

    <rect x="325" y="171" width="296" height="318" fill="#fafafa" stroke="#444" stroke-width="1.8"/>
    <path d="M325 231 H621" fill="none" stroke="#bbb" stroke-width="1.2"/>
    <text x="473" y="211" text-anchor="middle" font-size="29" font-weight="600" letter-spacing="3">官禄宫</text>

    <g text-anchor="middle">
      <text x="132" y="236" font-size="18" fill="#666">四化星</text>
      <text x="132" y="275" font-size="29" font-weight="600">化权</text>
      <rect x="49" y="330" width="166" height="86" rx="3" fill="none" stroke="#888" stroke-width="1.3"/>
      <text x="132" y="366" font-size="23" font-weight="600">紫微＋七杀</text>
      <text x="132" y="398" font-size="19">同宫</text>
    </g>
    <g fill="none" stroke="#555" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M177 265 H261 V373 H215"/>
      <path d="M261 298 H347" marker-end="url(#arrow)"/>
    </g>

    <g fill="#fff" stroke="#444" stroke-width="1.7">
      <circle cx="397" cy="298" r="42"/>
      <circle cx="549" cy="298" r="42"/>
    </g>
    <g text-anchor="middle" font-size="26" font-weight="600">
      <text x="397" y="307">权星</text>
      <text x="549" y="307">财星</text>
    </g>
    <g fill="none" stroke="#555" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M397 341 V367 H417 M549 341 V367 H529"/>
      <path d="M473 387 V409" marker-end="url(#arrow)"/>
    </g>
    <text x="473" y="374" text-anchor="middle" font-size="21">会在一起</text>
    <text x="473" y="454" text-anchor="middle" font-size="34" font-weight="600" letter-spacing="3" fill="#aa392f">财权</text>

    <g fill="none" stroke="#777" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M520 442 H659 V310 H685 M659 369 H685"/>
    </g>
    <g font-size="24">
      <text x="701" y="318">银行的总经理</text>
      <text x="701" y="377">中央银行的总裁</text>
    </g>
    <text x="701" y="450" font-size="21" fill="#555">钱不是他的</text>
  </g>
</svg>
