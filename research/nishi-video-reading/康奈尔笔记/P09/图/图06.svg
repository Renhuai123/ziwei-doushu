<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">三个科甲星</title>
  <desc id="desc">命盘上方框出天魁，左下财帛格标出天钺、化科。按倪师本例的讲法，两颗科甲星再加化科，合为三个科甲星，主聪明、才艺好；有专业技术专长又逢破军，则是捧着饭碗走天下，课上以林峰唱歌为例。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 1.5 8 5 2 8.5" fill="none" stroke="#595959" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="960" height="540" fill="#fff"/>
  <g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" fill="#262626">

    <g stroke-linejoin="round">
      <path d="M128 40H208V102H128Z M48 226H128V302H48Z" fill="#f3f3f1"/>
      <g fill="none" stroke="#b3b3ae" stroke-width="1.3">
        <rect x="48" y="40" width="320" height="262"/>
        <path d="M128 40V302 M288 40V302 M208 40V102 M208 226V302
                 M48 102H368 M48 226H368 M48 164H128 M288 164H368"/>
      </g>
      <rect x="141" y="54" width="54" height="33" rx="2" fill="#fff" stroke="#474747" stroke-width="1.5"/>
    </g>
    <g text-anchor="middle">
      <text x="168" y="78" font-size="21" font-weight="600">天魁</text>
      <text x="88" y="250" font-size="20" font-weight="600">天钺</text>
      <text x="88" y="273" font-size="19">化科</text>
      <text x="88" y="295" font-size="15" fill="#626262">财帛</text>
    </g>

    <g text-anchor="middle">
      <text x="658" y="74" font-size="25">两个科甲星</text>
      <path d="M658 89V135" fill="none" stroke="#595959" stroke-width="1.6" marker-end="url(#arrow)"/>
      <text x="678" y="119" text-anchor="start" font-size="20">再化科</text>
      <text x="658" y="181" font-size="36" font-weight="600"><tspan fill="#ab392e">三</tspan>个科甲星</text>
      <path d="M658 198V220 M540 237V220H776V237" fill="none" stroke="#888883" stroke-width="1.4" stroke-linejoin="round"/>
      <text x="540" y="273" font-size="24">聪明智慧</text>
      <text x="776" y="273" font-size="24">先天才艺一定很好</text>
    </g>

    <path d="M48 333H912" fill="none" stroke="#d2d2cd" stroke-width="1.2"/>

    <g text-anchor="middle">
      <text x="139" y="387" font-size="24">专业技术专长</text>
      <text x="139" y="440" font-size="24">破军星</text>
      <path d="M227 379H250V432H227 M250 405H302" fill="none" stroke="#595959" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
      <text x="463" y="415" font-size="31" font-weight="600">捧着饭碗走天下</text>
      <path d="M599 405H689" fill="none" stroke="#595959" stroke-width="1.6" marker-end="url(#arrow)"/>
      <text x="795" y="415" font-size="29">四海为家</text>
    </g>

    <g fill="#535353" text-anchor="middle" font-size="19">
      <path d="M332 449V485H359" fill="none" stroke="#aaa9a3" stroke-width="1.3"/>
      <text x="393" y="492" font-weight="600">林峰</text>
      <text x="515" y="492">唱歌唱得真好</text>
      <path d="M590 485H684" fill="none" stroke="#777" stroke-width="1.3" marker-end="url(#arrow)"/>
      <text x="747" y="492">声名远播</text>
    </g>
  </g>
</svg>
