    <rect x="290" y="80" width="380" height="380" fill="none" stroke="#353535" stroke-width="2.8"/>
    <rect x="437" y="227" width="86" height="86" fill="#f5f5f3" stroke="#353535" stroke-width="2.2"/>
    <circle cx="480" cy="270" r="14" fill="none" stroke="#353535" stroke-width="2.2"/>
    <path d="M527 270 H549" fill="none" stroke="#888" stroke-width="1.3"/>
    <text x="558" y="278" fill="#333" font-size="23">厕所</text>
  </g>
