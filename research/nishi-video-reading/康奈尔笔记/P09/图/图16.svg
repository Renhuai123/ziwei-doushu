<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">厕所与厨房</title>
  <desc id="desc">左侧用两幅房屋俯视图对照靠边开窗的厕所与居中无窗的厕所，画出倪师所讲的“心脏在那边闷到的象”。右侧沿用黑板上南下北的排法，外围每一格分别表示厨房落在该处时，倪师在课中所作的说法。</desc>

  <rect width="960" height="540" fill="#fff"/>
  <g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" fill="#262626">
    <g font-size="28" font-weight="600">
      <text x="48" y="68">厕所</text>
      <text x="488" y="68">厨房</text>
    </g>
    <path d="M48 88H423 M488 88H912" fill="none" stroke="#ccc" stroke-width="1"/>

    <!-- 同样大小的两幅房屋平面。上图的厕所有一面墙与外墙重合。 -->
    <g stroke-linejoin="round">
      <rect x="48" y="143" width="192" height="124" fill="#fff" stroke="#383838" stroke-width="2.4"/>
      <path d="M99 143H189V207H99Z" fill="#f3f3f1"/>
      <path d="M99 143V207H149 M174 207H189V143" fill="none" stroke="#383838" stroke-width="2"/>
      <path d="M149 207V182 M149 182A25 25 0 0 1 174 207" fill="none" stroke="#999" stroke-width="1.2"/>
      <rect x="119" y="136" width="50" height="14" fill="#fff" stroke="#383838" stroke-width="1.6"/>
      <path d="M119 143H169 M131.5 136V150 M144 136V150 M156.5 136V150" fill="none" stroke="#383838" stroke-width="1.2"/>
    </g>
    <text x="144" y="177" text-anchor="middle" font-size="19">厕所</text>
    <path d="M170 140L192 121H256" fill="none" stroke="#858585" stroke-width="1.2"/>
    <text x="267" y="127" font-size="19">窗格子</text>
    <text x="267" y="193" font-size="35">開</text>

    <!-- 下图的厕所四面均在房屋内部，只留房门。 -->
    <g stroke-linejoin="round">
      <rect x="48" y="338" width="192" height="124" fill="#fff" stroke="#383838" stroke-width="2.4"/>
      <path d="M99 368H189V432H99Z" fill="#f3f3f1"/>
      <path d="M149 432H99V368H189V432H174" fill="none" stroke="#383838" stroke-width="2"/>
      <path d="M149 432V407 M149 407A25 25 0 0 1 174 432" fill="none" stroke="#999" stroke-width="1.2"/>
    </g>
    <text x="144" y="402" text-anchor="middle" font-size="19">厕所</text>
    <path d="M190 379L212 357H256" fill="none" stroke="#858585" stroke-width="1.2"/>
    <text x="267" y="363" font-size="19">没有窗户</text>
    <text x="267" y="407" font-size="18">
      <tspan x="267">心脏在那边</tspan><tspan x="267" dy="27">闷到的象</tspan>
    </text>

    <!-- 每一格是一个独立例子。中心留空。 -->
    <rect x="488" y="126" width="424" height="336" fill="#fff" stroke="#383838" stroke-width="2.4"/>
    <rect x="629" y="238" width="142" height="112" fill="#f5f5f3"/>
    <path d="M629 126V462 M771 126V462 M488 238H912 M488 350H912" fill="none" stroke="#666" stroke-width="1.5"/>
    <g text-anchor="middle" font-size="22">
      <text x="559" y="190">死长女</text>
      <text x="700" y="190">死二女儿</text>
      <text x="841" y="190">死太太</text>
      <text x="559" y="302">死长子</text>
      <text x="841" y="302">死三女儿</text>
      <text x="559" y="414">死三儿子</text>
      <text x="700" y="414">死二儿子</text>
      <text x="841" y="397">先生</text>
      <text x="841" y="427" font-size="17" fill="#555">夫妻死别</text>
    </g>
  </g>
</svg>
