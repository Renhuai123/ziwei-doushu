  <title id="title">手相入后天八卦</title>
  <desc id="desc">手掌正面朝向读者，指尖向上，拇指在左。指根下方从左到右是巽、离、坤，掌心两侧是震、兑，近腕处是艮、坎、乾，正中圈出明堂。</desc>
