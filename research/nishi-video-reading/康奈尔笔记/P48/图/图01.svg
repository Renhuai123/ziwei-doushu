      <text x="140" y="204" font-size="22">化禄</text>

      <ellipse cx="140" cy="348" rx="70" ry="24" fill="none" stroke="#666" stroke-width="1.3"/>
      <text x="140" y="356" font-size="23">廉贞七杀</text>
      <text x="140" y="408" font-size="22">福德</text>
    </g>
    <g font-size="25" font-weight="600">
      <text x="298" y="179">沾酒色财气</text>
      <text x="298" y="379">屠夫</text>
    </g>

    <path d="M461 75 V465" fill="none" stroke="#dededb" stroke-width="1"/>
    <text x="650" y="69" text-anchor="middle" font-size="28" font-weight="600" letter-spacing="3">风字脸</text>

    <g stroke-linecap="round" stroke-linejoin="round">
