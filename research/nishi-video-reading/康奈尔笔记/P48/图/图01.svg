<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">贪狼化禄与风字脸</title>
  <desc id="desc">左侧用两个独立的宫格节录倪师所举的特例。右侧按课堂口述画出风字脸的正面轮廓，用浅灰线面表现两颧突出、颧下内凹，以及从宽腮向前收尖的形状。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 1.5 L8 5 L2 8.5" fill="none" stroke="#555" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="960" height="540" fill="#fff"/>
  <g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" fill="#262626">
    <g fill="none" stroke="#555" stroke-width="1.6">
      <rect x="44" y="107" width="192" height="126"/>
      <rect x="44" y="307" width="192" height="126"/>
      <path d="M247 170 H283 M247 370 H283" marker-end="url(#arrow)"/>
    </g>
    <path d="M247 170 H283" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>

    <g text-anchor="middle">
