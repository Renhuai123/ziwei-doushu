<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">鼻如灶门</title>
  <desc id="desc">左边的灶台上有两个椭圆孔，右后方竖着烟囱，正面有两扇黑色拱形铁门。右边画出上翻的鼻头和完整露出的两个鼻孔，与两扇灶门相对照。</desc>

  <rect width="960" height="540" fill="#fff"/>
  <g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" fill="#282828">
    <rect x="48" y="35" width="158" height="48" rx="3" fill="none" stroke="#454545" stroke-width="1.5"/>
    <text x="127" y="67" text-anchor="middle" font-size="25" font-weight="600" letter-spacing="2">鼻如灶门</text>

    <!-- 灶台三面。两扇门都在正面，与台面上的两个孔分开。 -->
    <g stroke="#383838" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M84 263 L171 202 H465 L378 263 Z" fill="#fafaf9"/>
      <path d="M378 263 L465 202 V327 L378 388 Z" fill="#e8e8e5"/>
      <path d="M84 263 H378 V388 H84 Z" fill="#f4f4f2"/>

      <g fill="#e5e5e2" stroke-width="2">
        <ellipse cx="193" cy="234" rx="41" ry="12" transform="rotate(-7 193 234)"/>
        <ellipse cx="310" cy="234" rx="41" ry="12" transform="rotate(-7 310 234)"/>
      </g>

      <!-- 烟囱落在台面右后角。 -->
      <path d="M389 113 V211 C389 220 421 220 421 211 V113 Z" fill="#f4f4f2"/>
      <ellipse cx="405" cy="113" rx="16" ry="5" fill="#dededb"/>

      <g fill="#353535" stroke="#282828" stroke-width="2">
        <path d="M146 354 V332 A27 29 0 0 1 200 332 V354 Z"/>
        <path d="M262 354 V332 A27 29 0 0 1 316 332 V354 Z"/>
      </g>
    </g>

    <text x="331" y="146" text-anchor="middle" font-size="19">烟囱</text>
    <path d="M358 140 H371 L385 150" fill="none" stroke="#878787" stroke-width="1.3" stroke-linecap="round"/>

    <!-- 箭头位于两扇灶门与两个鼻孔的高度。 -->
    <path d="M487 329 H570 M559 322 L570 329 L559 336" fill="none" stroke="#777" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 鼻梁线渐展为两翼，仰露的鼻底内画出完整的左右鼻孔。 -->
    <g stroke-linecap="round" stroke-linejoin="round">
      <g fill="none" stroke="#565656" stroke-width="2.3">
        <path d="M713 163 C714 202 708 235 691 266 C685 276 677 284 670 291"/>
        <path d="M772 163 C771 202 777 235 794 266 C800 276 808 284 815 291"/>
      </g>
      <path d="M676 276
               C655 278 638 294 635 315
               C631 336 643 354 662 359
               C676 363 689 357 702 351
               C714 346 723 351 731 360
               C738 368 747 368 754 360
               C762 351 771 346 783 351
               C796 357 809 363 823 359
               C842 354 854 336 850 315
               C847 294 830 278 809 276"
            fill="#fafaf9" stroke="#383838" stroke-width="2.5"/>
      <path d="M685 295 C698 291 706 282 718 277
               C733 270 752 270 767 277
               C779 282 787 291 800 295"
            fill="none" stroke="#999" stroke-width="1.5"/>
      <g fill="#353535">
        <ellipse cx="689" cy="327" rx="23" ry="17" transform="rotate(-19 689 327)"/>
        <ellipse cx="796" cy="327" rx="23" ry="17" transform="rotate(19 796 327)"/>
      </g>
    </g>

    <g text-anchor="middle" font-size="23" font-weight="500">
      <text x="231" y="440">两个灶门</text>
      <text x="743" y="440">鼻孔</text>
    </g>
  </g>
</svg>
