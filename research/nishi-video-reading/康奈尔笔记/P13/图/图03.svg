<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">巨日格</title>
  <desc id="desc">巨门与太阳会到，分两路读。上路是庙旺，很亮，成正格，倪师以「腰金衣紫」「巨贾」形容。下路是课中这张盘，太阳陷、巨门平，两星不亮，仍叫巨日格，却不成正格，落在「偏」。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 1.5 8 5 2 8.5" fill="none" stroke="#626262" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="960" height="540" fill="#fff"/>
  <g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" fill="#242424" text-anchor="middle">
    <rect x="48" y="36" width="144" height="48" rx="3" fill="none" stroke="#444" stroke-width="1.5"/>
    <text x="120" y="69" font-size="26" font-weight="600" letter-spacing="2">巨日格</text>

    <g fill="none" stroke="#777" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M154 228 H176 L207 268 M154 308 H176 L207 268 H224"/>
      <path d="M290 268 H320 M320 268 V158 H402 M320 268 V378 H402"/>
      <path d="M543 158 H634 M543 378 H634" marker-end="url(#arrow)"/>
    </g>

    <g fill="#f6f6f5" stroke="#777" stroke-width="1.3">
      <rect x="48" y="202" width="106" height="52" rx="2"/>
      <rect x="48" y="282" width="106" height="52" rx="2"/>
    </g>
    <g font-size="25">
      <text x="101" y="237">巨门</text>
      <text x="101" y="317">太阳</text>
      <text x="257" y="277">会到</text>
    </g>

    <text x="473" y="166" font-size="32" font-weight="600">庙旺</text>
    <path d="M442 178 H504" fill="none" stroke="#ad4135" stroke-width="2.5" stroke-linecap="round"/>
    <text x="473" y="207" font-size="21" fill="#555">很亮</text>

    <text x="740" y="168" font-size="32" font-weight="600">正格</text>
    <text x="740" y="211" font-size="24">腰金衣紫</text>
    <text x="740" y="244" font-size="21" fill="#555">巨贾</text>

    <g font-size="24">
      <text x="444" y="351">太阳</text>
      <text x="511" y="351" font-weight="600">陷</text>
      <text x="444" y="388">巨门</text>
      <text x="511" y="388" font-weight="600">平</text>
    </g>
    <path d="M418 402 H528" fill="none" stroke="#b8b8b8" stroke-width="1"/>
    <text x="473" y="433" font-size="21" fill="#555">不亮</text>

    <text x="740" y="388" font-size="32" font-weight="600">不成正格</text>
    <path d="M740 402 V420" fill="none" stroke="#777" stroke-width="1.4" marker-end="url(#arrow)"/>
    <circle cx="740" cy="452" r="24" fill="none" stroke="#626262" stroke-width="1.5"/>
    <text x="740" y="461" font-size="25">偏</text>
  </g>
</svg>
